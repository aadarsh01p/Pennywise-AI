<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyWise AI | Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-wallet2"></i>
            <h4>PennyWise AI</h4>
        </div>

        <nav>
            <a href="/dashboard" class="active">
                <i class="bi bi-grid-fill"></i> Dashboard
            </a>

            <a href="/transactions">
                <i class="bi bi-cash-stack"></i> Transactions
            </a>

            <a href="/upload">
                <i class="bi bi-upload"></i> Upload CSV
            </a>

            <a href="/reports">
                <i class="bi bi-bar-chart"></i> Reports
            </a>

            <a href="/budget">
                <i class="bi bi-wallet-fill"></i> Budget
            </a>

            <a href="/goals">
                <i class="bi bi-bullseye"></i> Goals
            </a>

            <a href="/chatbot">
                <i class="bi bi-robot"></i> AI Assistant
            </a>
        </nav>

        <button class="logout-btn" id="logoutBtn">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Top Bar -->
        <header class="topbar">

            <div>
                <h2 id="welcomeUser">Hello</h2>
                <p>Here's your financial overview for today.</p>
            </div>

            <div class="top-actions">
                <button class="btn btn-primary" id="uploadBtn">
                    Upload CSV
                </button>

                <button class="btn btn-outline-primary" id="askAiBtn">
                    Ask AI
                </button>
            </div>

        </header>

        <!-- Summary Cards -->
        <section class="summary-grid">

            <div class="summary-card income">
                <h6>Income</h6>
                <h3 id="income">₹0</h3>
                <small>Total Income</small>
            </div>

            <div class="summary-card expense">
                <h6>Expenses</h6>
                <h3 id="expense">₹0</h3>
                <small>Total Expenses</small>
            </div>

            <div class="summary-card savings">
                <h6>Savings</h6>
                <h3 id="savings">₹0</h3>
                <small>Current Savings</small>
            </div>

            <div class="summary-card health">
                <h6>Health Score</h6>
                <h3 id="health">0/100</h3>
                <small id="healthStatus">Loading...</small>
            </div>

        </section>

        <!-- Charts -->
        <section class="grid-2">

            <div class="card">
                <h4>Monthly Expenses</h4>
                <canvas id="lineChart"></canvas>
            </div>

            <div class="card">
                <h4>Expense Categories</h4>
                <canvas id="pieChart"></canvas>
            </div>

        </section>

        <!-- Future Sections -->
        <!--
            Recent Transactions
            AI Insights
            Budget Progress
            Savings Goals
        -->

    </main>

</div>

<script>
const lineChartCanvas = document.getElementById("lineChart");
const pieChartCanvas = document.getElementById("pieChart");
const welcomeUser = document.getElementById("welcomeUser");
const income = document.getElementById("income");
const expense = document.getElementById("expense");
const savings = document.getElementById("savings");
const health = document.getElementById("health");
const healthStatus = document.getElementById("healthStatus");
const logoutBtn = document.getElementById("logoutBtn");
const uploadBtn = document.getElementById("uploadBtn");
const askAiBtn = document.getElementById("askAiBtn");

askAiBtn?.addEventListener("click", () => {
    location.href = "/chatbot";
});
</script>

<script src="/static/js/dashboard.js"></script>

</body>
</html>
