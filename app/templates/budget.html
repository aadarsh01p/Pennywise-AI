<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PennyWise AI | Budget</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-wallet2"></i>
            <h4>PennyWise AI</h4>
        </div>

        <nav>

            <a href="/dashboard"><i class="bi bi-grid-fill"></i> Dashboard</a>

            <a href="/transactions"><i class="bi bi-cash-stack"></i> Transactions</a>

            <a href="/upload"><i class="bi bi-upload"></i> Upload CSV</a>

            <a href="/reports"><i class="bi bi-bar-chart"></i> Reports</a>

            <a href="/budget" class="active"><i class="bi bi-wallet-fill"></i> Budget</a>

            <a href="/goals"><i class="bi bi-bullseye"></i> Goals</a>

            <a href="/chatbot"><i class="bi bi-robot"></i> AI Assistant</a>

        </nav>

        <button class="logout-btn" id="logoutBtn">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <h2>Budget Planner</h2>

                <p>
                    AI-generated monthly budget for every expense category.
                </p>

            </div>

        </header>

        <div class="card p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h4 class="mb-1">
                        Smart Monthly Budget
                    </h4>

                    <small class="text-muted">
                        Budget recommendations are generated using your spending history.
                    </small>

                </div>

                <button
                    id="generateBtn"
                    class="btn btn-primary">

                    <i class="bi bi-stars"></i>

                    Generate AI Budget

                </button>

            </div>

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th>Category</th>

                        <th>Avg Monthly Spend</th>

                        <th>AI Budget</th>

                        <th>Difference</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="budgetTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="/static/js/budget.js"></script>

</body>
</html>
