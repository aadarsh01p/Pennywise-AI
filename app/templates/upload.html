<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PennyWise AI | Upload CSV</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


<div class="wrapper">


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside class="sidebar">


        <div class="logo">

            <i class="bi bi-wallet2"></i>

            <h4>PennyWise AI</h4>

        </div>


        <nav>


            <a href="/dashboard">

                <i class="bi bi-grid-fill"></i>

                Dashboard

            </a>


            <a href="/transactions">

                <i class="bi bi-cash-stack"></i>

                Transactions

            </a>


            <a
                href="/upload"
                class="active"
            >

                <i class="bi bi-upload"></i>

                Upload CSV

            </a>


            <a href="/reports">

                <i class="bi bi-bar-chart"></i>

                Reports

            </a>


            <a href="/budget">

                <i class="bi bi-wallet-fill"></i>

                Budget

            </a>


            <a href="/goals">

                <i class="bi bi-bullseye"></i>

                Goals

            </a>


            <a href="/chatbot">

                <i class="bi bi-robot"></i>

                AI Assistant

            </a>


        </nav>


        <button
            class="logout-btn"
            id="logoutBtn"
        >

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </button>


    </aside>



    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main-content">


        <!-- =====================================
             TOP BAR
        ====================================== -->

        <header class="topbar">


            <div>

                <h2>
                    Upload Bank Statement
                </h2>


                <p>
                    Upload your bank statement in CSV format.
                </p>

            </div>


        </header>



        <!-- =====================================
             UPLOAD SECTION
        ====================================== -->

        <section class="upload-section">


            <div class="upload-card">


                <!-- Upload Icon -->

                <div class="upload-icon">

                    <i class="bi bi-cloud-arrow-up"></i>

                </div>


                <h3>
                    Select CSV File
                </h3>


                <p class="upload-description">

                    Upload your bank transaction statement
                    in CSV format.

                </p>



                <!-- =====================================
                     UPLOAD FORM
                ====================================== -->

                <form id="uploadForm">


                    <div class="file-input-wrapper">


                        <input
                            type="file"
                            id="csvFile"
                            name="file"
                            accept=".csv,text/csv"
                            required
                        >


                    </div>



                    <button
                        type="submit"
                        class="upload-submit-btn"
                        id="uploadBtn"
                    >

                        <i class="bi bi-upload"></i>

                        Upload CSV

                    </button>


                </form>



                <!-- =====================================
                     UPLOAD STATUS
                ====================================== -->

                <div
                    id="uploadStatus"
                    class="upload-status"
                    style="display: none;"
                ></div>


            </div>


        </section>


    </main>


</div>



<!-- =========================================
     CSV UPLOAD ANIMATION
========================================= -->

<div
    id="csvLoader"
    class="csv-loader"
>


    <!-- =====================================
         COIN
    ====================================== -->

    <div
        class="coin-loader"
        id="coinLoader"
    >


        <div
            class="coin"
            id="uploadCoin"
        >


            <div
                class="coin-face"
                id="coinFace"
            >


                <span
                    id="coinSymbol"
                    class="coin-symbol"
                >
                    ₹
                </span>


            </div>


        </div>



        <!-- Coin Shadow -->

        <div class="coin-shadow"></div>


    </div>



    <!-- =====================================
         LOADER MESSAGE
    ====================================== -->

    <div
        class="loader-text"
        id="loaderText"
    >

        Processing your statement


        <span class="loading-dots">

            <span>.</span>

            <span>.</span>

            <span>.</span>

        </span>


    </div>


</div>



<!-- =========================================
     UPLOAD JS
========================================= -->

<script src="/static/js/upload.js?v=7"></script>


</body>

</html>
