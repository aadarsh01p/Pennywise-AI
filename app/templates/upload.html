<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PennyWise AI | Upload CSV</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-wallet2"></i>
            <h4>PennyWise AI</h4>
        </div>

        <nav>

            <a href="/dashboard">
                <i class="bi bi-grid-fill"></i> Dashboard
            </a>

            <a href="/transactions">
                <i class="bi bi-cash-stack"></i> Transactions
            </a>

            <a href="/upload" class="active">
                <i class="bi bi-upload"></i> Upload CSV
            </a>

            <a href="/reports">
                <i class="bi bi-bar-chart"></i> Reports
            </a>

            <a href="/budget">
                <i class="bi bi-wallet-fill"></i> Budget
            </a>

            <a href="/goals">
                <i class="bi bi-bullseye"></i> Goals
            </a>

            <a href="/chatbot">
                <i class="bi bi-robot"></i> AI Assistant
            </a>

        </nav>

        <button class="logout-btn" id="logoutBtn">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <header class="topbar">

            <div>
                <h2>Upload Bank Statement</h2>
                <p>Upload your bank statement in CSV format.</p>
            </div>

        </header>

        <div class="card p-5">

            <form
                action="/upload/csv"
                method="POST"
                enctype="multipart/form-data">

                <div class="mb-4">

                    <label class="form-label">
                        Select CSV File
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        name="file"
                        accept=".csv"
                        required>

                </div>

                <button
                    class="btn btn-primary"
                    type="submit">

                    <i class="bi bi-upload"></i>

                    Upload CSV

                </button>

            </form>

        </div>

    </main>

</div>

</body>
</html>
