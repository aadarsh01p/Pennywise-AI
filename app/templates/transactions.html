<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyWise AI | Transactions</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/transactions.css">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-wallet2"></i>
            <h4>PennyWise AI</h4>
        </div>

        <nav>

            <a href="/dashboard">
                <i class="bi bi-grid-fill"></i> Dashboard
            </a>

            <a href="/transactions" class="active">
                <i class="bi bi-cash-stack"></i> Transactions
            </a>

            <a href="/upload">
                <i class="bi bi-upload"></i> Upload CSV
            </a>

            <a href="/reports">
                <i class="bi bi-bar-chart"></i> Reports
            </a>

            <a href="/budget">
                <i class="bi bi-wallet-fill"></i> Budget
            </a>

            <a href="/goals">
                <i class="bi bi-bullseye"></i> Goals
            </a>

            <a href="/chatbot">
                <i class="bi bi-robot"></i> AI Assistant
            </a>

        </nav>

        <button class="logout-btn" id="logoutBtn">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <header class="topbar">

            <div>
                <h2>Transactions</h2>
                <p>Manage all your income and expense records.</p>
            </div>

            <button class="btn btn-primary" onclick="openModal()">
                <i class="bi bi-plus-circle"></i>
                Add Transaction
            </button>

        </header>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="transactionTable"></tbody>

            </table>

        </div>

    </main>

</div>

<!-- Modal -->

<div class="modal" id="transactionModal">

    <div class="modal-content">

        <h2>Add Transaction</h2>

        <form id="transactionForm">

            <input type="date" id="date" required>

            <input
                type="text"
                id="description"
                placeholder="Description"
                required>

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                required>

            <select id="transaction_type">
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
            </select>

            <button type="submit" class="btn btn-primary">
                Save Transaction
            </button>

        </form>

    </div>

</div>

<script src="/static/js/transactions.js"></script>

</body>
</html>
