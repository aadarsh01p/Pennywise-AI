<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transactions | PennyWise AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/transactions.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-wallet"></i>
            <h2>PennyWise AI</h2>
        </div>

        <nav>

            <a href="/dashboard">
                <i class="fa-solid fa-table-columns"></i> Dashboard
            </a>

            <a href="/transactions" class="active">
                <i class="fa-solid fa-money-bill-transfer"></i> Transactions
            </a>

            <a href="/upload">
                <i class="fa-solid fa-upload"></i> Upload CSV
            </a>

            <a href="/reports">
                <i class="fa-solid fa-chart-column"></i> Reports
            </a>

            <a href="/budget">
                <i class="fa-solid fa-wallet"></i> Budget
            </a>

            <a href="/goals">
                <i class="fa-solid fa-bullseye"></i> Goals
            </a>

            <a href="/ai">
                <i class="fa-solid fa-robot"></i> AI Assistant
            </a>

            <a href="/logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>

        </nav>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <div class="page-header">

            <h1>Transactions</h1>

            <button class="add-btn" onclick="openModal()">
                <i class="fa-solid fa-plus"></i>
                Add Transaction
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="transactionTable"></tbody>

            </table>

        </div>

    </main>

</div>

<!-- Modal -->

<div class="modal" id="transactionModal">

    <div class="modal-content">

        <h2>Add Transaction</h2>

        <form id="transactionForm">

            <input type="date" id="date" required>

            <input type="text"
                   id="description"
                   placeholder="Description"
                   required>

            <input type="number"
                   id="amount"
                   placeholder="Amount"
                   required>

            <select id="transaction_type">
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
            </select>

            <button type="submit" class="add-btn">
                Save Transaction
            </button>

        </form>

    </div>

</div>

<script src="/static/js/transactions.js"></script>

</body>
</html>
